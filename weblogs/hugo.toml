baseURL = "https://arjunharitsa.github.io/"
locale = "en-US"
title = "Arjun's Portfolio"
theme = "polar"

[pagination]
  pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

[markup.highlight]
  # Polar styles Chroma's CSS classes so code follows the scheme and accent.
  noClasses = false

[params]
  author = "Arjun Haritsa"
  accent = "blue"
  readingTime = true
  mainSections = ["posts"]
  postLanguages = [
    { code = "en", label = "English" },
    { code = "kn", label = "ಕನ್ನಡ" },
  ]

[params.logo]
  icon = ""
  text = "Arjun Haritsa"

[params.giscus]
  repo = "ArjunHaritsa/ArjunHaritsa.github.io"
  repoId = "R_kgDOQ2uxrA"
  category = "General"
  categoryId = "DIC_kwDOQ2uxrM4C0yih"

